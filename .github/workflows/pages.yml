# Build and publish to GitHub Pages.
#  - on every push to main
#  - weekly (Monday 03:00 JST) with the latest station data
#  - manually from the Actions tab
# Repository settings: Settings → Pages → Source = "GitHub Actions".
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * 0"   # Sunday 18:00 UTC = Monday 03:00 JST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (latest station data on schedule/manual runs)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            python3 scripts/build.py
          else
            python3 scripts/build.py --fetch
          fi
      - name: Test
        run: |
          node tests/check_html.js
          node tests/verify.js --quick
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
